<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Remote TV</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Living room TV</h1>
  <section class="card">
    <div class="big" id="mode">...</div>
    <div class="sub" id="detail"></div>
    <div class="sub" id="next"></div>
    <div class="sub warn" id="error"></div>
  </section>
  <section class="card">
    <h2>Set now</h2>
    <div class="row">
      <button data-mode="day">Day</button>
      <button data-mode="evening">Evening</button>
      <button data-mode="night">Night</button>
    </div>
    <button class="wide" data-mode="auto">Back to schedule</button>
    <button class="wide" id="pause">Pause schedule</button>
  </section>
  <section class="card">
    <h2>Backlight levels</h2>
    <label>Day <input id="lv-day" type="number" min="5" max="100" inputmode="numeric"></label>
    <label>Evening <input id="lv-evening" type="number" min="5" max="100" inputmode="numeric"></label>
    <label>Night <input id="lv-night" type="number" min="5" max="100" inputmode="numeric"></label>
    <button class="wide" id="save">Save levels</button>
  </section>
  <section class="card">
    <h2>Maintenance</h2>
    <button class="wide" id="apply">Apply backlight now (test)</button>
    <button class="wide" id="update">Update the program</button>
    <div class="sub" id="upd"></div>
    <div class="sub" id="version"></div>
  </section>
  <section class="card">
    <h2>Mode switch test</h2>
    <p class="sub">Sends the TV's own picture-mode command. Watch the TV and tell Claude what changed.</p>
    <button class="wide" data-exp="es|picture_mode|movie">Try: picture_mode = movie</button>
    <button class="wide" data-exp="es|mode|movie">Try: mode = movie</button>
    <button class="wide" data-exp="ei|picture_mode|1">Try: picture_mode = 1 (number)</button>
    <label>Type <select id="ex-type"><option>es</option><option>ei</option><option>ez</option></select></label>
    <label>Name <input id="ex-key" type="text" autocapitalize="off" autocomplete="off"></label>
    <label>Value <input id="ex-val" type="text" autocapitalize="off" autocomplete="off"></label>
    <button class="wide" id="ex-send">Send my own</button>
    <div class="sub" id="ex-out"></div>
    <button class="wide" id="ex-copy">Copy result</button>
  </section>
  <p class="foot" id="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
