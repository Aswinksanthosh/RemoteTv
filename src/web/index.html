<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Remote TV</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Living room TV</h1>
  <section class="card">
    <div class="big" id="mode">...</div>
    <div class="sub" id="detail"></div>
    <div class="sub" id="next"></div>
    <div class="sub warn" id="error"></div>
  </section>
  <section class="card">
    <h2>Choose</h2>
    <div class="row">
      <button data-mode="day">Day</button>
      <button data-mode="evening">Evening</button>
      <button data-mode="night">Night</button>
    </div>
    <button class="wide" data-mode="auto" id="back">Back to schedule</button>
    <button class="wide" id="auto">Turn automatic schedule on</button>
  </section>
  <section class="card">
    <h2>Backlight levels</h2>
    <label>Day <input id="lv-day" type="number" min="5" max="100" inputmode="numeric"></label>
    <label>Evening <input id="lv-evening" type="number" min="5" max="100" inputmode="numeric"></label>
    <label>Night <input id="lv-night" type="number" min="5" max="100" inputmode="numeric"></label>
    <button class="wide" id="save">Save levels</button>
  </section>
  <section class="card">
    <h2>Maintenance</h2>
    <button class="wide" id="apply">Apply backlight now (test)</button>
    <button class="wide" id="update">Update the program</button>
    <div class="sub" id="upd"></div>
    <div class="sub" id="version"></div>
  </section>
  <p class="foot" id="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
